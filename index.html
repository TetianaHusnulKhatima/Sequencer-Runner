<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>5. Sequencer Runner</title><style>body{background:#0b0e14;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#121824;border:2px solid #0052FF;}</style></head>
<body>
<h1>5. Sequencer Runner</h1>
<canvas id="c" width="300" height="200"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let y=150, dy=0, obs=300, score=0;
document.onkeydown = () => { if(y===150) dy=-8; };
function loop() {
    ctx.clearRect(0,0,300,200);
    dy += 0.5; y += dy; if(y>150){y=150; dy=0;}
    obs -= 3; if(obs<-20){obs=300; score++;}
    ctx.fillStyle='#0052FF'; ctx.fillRect(40, y, 20, 20);
    ctx.fillStyle='#FF0055'; ctx.fillRect(obs, 150, 15, 20);
    ctx.fillStyle='#fff'; ctx.fillText('Score: '+score, 10, 20);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
